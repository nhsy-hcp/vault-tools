[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-tools"
version = "2.0.1"
description = "Unified CLI tool for HashiCorp Vault operations - namespace auditing, activity monitoring, and entity management"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MPL-2.0"}
authors = [
    {name = "Vault Tools Contributors"}
]
keywords = ["vault", "hashicorp", "security", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "hvac==2.2.0",
    "pandas>=2.3.0,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "structlog>=23.1.0",
    "tenacity>=8.2.3",
    "python-json-logger>=2.0.7",
    "cachetools>=5.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
vault-tools = "main:main"

[tool.setuptools]
# main.py sits at the repo root and supplies the console-script entry point
# above. Setuptools' auto-discovery only picks up packages, so without listing
# it explicitly the installed `vault-tools` script fails at import with
# ModuleNotFoundError: No module named 'main'.
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "hvac.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
]
