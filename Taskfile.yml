version: '3'

# Vault Tools - Task Automation
# Uses uv for modern, fast Python package management

dotenv: ['.env']

tasks:
  init:
    desc: "Perform one-time environment setup"
    cmds:
      - echo "Installing uv package manager..."
      - command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      - echo "Syncing dependencies with uv..."
      - uv sync
      - echo "Installing pre-commit hooks..."
      - uv run pre-commit install
      - echo "✅ Environment setup complete!"

  deps:
    desc: "Check for required dependencies and validate environment"
    cmds:
      - echo "Checking Python installation..."
      - command -v python >/dev/null 2>&1 || (echo "❌ Python not found" && exit 1)
      - python --version
      - echo "Checking uv installation..."
      - command -v uv >/dev/null 2>&1 || (echo "❌ uv not installed. Run 'task init'" && exit 1)
      - echo "Checking virtual environment..."
      - test -d .venv || (echo "❌ Virtual environment not found. Run 'task init'" && exit 1)
      - echo "Checking vault binary..."
      - command -v vault >/dev/null 2>&1 || echo "⚠️  vault binary not found. Install from https://www.vaultproject.io/downloads"
      - echo "✅ All dependencies satisfied"

  up:
    desc: "Start local Vault dev server for testing"
    cmds:
      - echo "Starting Vault dev server..."
      - echo "⚠️  Make sure vault binary is installed (https://www.vaultproject.io/downloads)"
      - echo "Starting vault server in dev mode with root token 'root'..."
      - echo "Add to your .env file:"
      - echo "  export VAULT_ADDR='http://127.0.0.1:8200'"
      - echo "  export VAULT_TOKEN='root'"
      - echo ""
      - vault server -dev -dev-root-token-id=root

  clean:
    desc: "Remove build artifacts, temporary files, and cache"
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf build/ dist/ *.egg-info/
      # Prune .venv and .git before matching: the venv alone holds ~100
      # __pycache__ directories that belong to installed dependencies, not to
      # this project, and deleting them only forces needless recompilation.
      - echo "Cleaning Python cache..."
      - find . -path ./.venv -prune -o -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -path ./.venv -prune -o -path ./.git -prune -o -type f -name "*.py[co]" -delete
      - echo "Cleaning test and lint caches..."
      - rm -rf .pytest_cache/ .ruff_cache/
      - echo "Cleaning temporary files..."
      - rm -rf .tmp/
      - echo "Cleaning coverage reports..."
      - rm -rf htmlcov/ .coverage coverage.xml
      - echo "✅ Cleanup complete"

  lint:
    desc: "Run all code quality, formatting, and security checks"
    cmds:
      - echo "Running pre-commit hooks..."
      - uv run pre-commit run --all-files
      - echo "✅ All linting checks passed"

  test:
    desc: "Execute the local unit and integration test suite"
    cmds:
      - echo "Running pytest..."
      - uv run pytest tests/ -v
      - echo "✅ All tests passed"

  test:all:
    desc: "Run the complete test suite across all modules"
    cmds:
      - echo "Running all tests with coverage..."
      - uv run pytest tests/ -v --cov=src --cov-report=term-missing
      - echo "✅ Complete test suite passed"

  test:coverage:
    desc: "Run the test suite and enforce a minimum 80% coverage threshold"
    cmds:
      - echo "Running tests with 80% minimum coverage gate..."
      - uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80
      - echo "✅ Coverage gate passed (≥80%)"

  test:ci:
    desc: "Execute the full verification pipeline as defined in CI"
    cmds:
      - echo "Running CI verification pipeline..."
      - task: lint
      - task: test:coverage
      - echo "✅ CI verification complete"

  test:gha:
    desc: "Run the GitHub Actions test job locally with act"
    vars:
      # The container architecture must match the host, or every step runs
      # under QEMU emulation: slow on Apple Silicon and liable to fail
      # outright. Override to reproduce CI's own architecture, e.g.
      # `task test:gha ACT_ARCH=linux/amd64`.
      ACT_ARCH: '{{.ACT_ARCH | default (printf "linux/%s" ARCH)}}'
    cmds:
      - command -v act >/dev/null 2>&1 || (echo "❌ act not installed. Install from https://github.com/nektos/act" && exit 1)
      # Validate first: a schema error is far cheaper to surface here than
      # after pulling an image and starting a container.
      - echo "Validating workflow definitions..."
      - act --validate
      - echo "✅ Workflow definitions valid"
      - echo "Checking container engine..."
      - docker info >/dev/null 2>&1 || (echo "❌ No reachable container engine. Start Docker or Podman and retry." && exit 1)
      - 'echo "Running GitHub Actions test job on {{.ACT_ARCH}}..."'
      - act -j test --container-architecture {{.ACT_ARCH}} -P ubuntu-latest=catthehacker/ubuntu:act-latest
      - echo "✅ GitHub Actions test job passed"

  build:
    desc: "Build the package for distribution"
    cmds:
      - echo "Building package..."
      - uv build
      - echo "✅ Package built successfully"
      - ls -lh dist/

  install:
    desc: "Install the package in development mode"
    cmds:
      - echo "Installing in development mode..."
      - uv pip install -e .
      - echo "✅ Package installed"
      - echo "Run 'vault-tools --help' to verify"

  run:
    desc: "Run the CLI tool (usage: task run -- <args>)"
    cmds:
      - uv run vault-tools {{.CLI_ARGS}}

  update:
    desc: "Update dependencies to latest versions"
    cmds:
      - echo "Updating dependencies..."
      - uv sync --upgrade
      - echo "✅ Dependencies updated"

  help:
    desc: "Show available tasks"
    cmds:
      - task --list
